<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pi Dashboard — Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/shell.css" />
  <link rel="stylesheet" href="/css/panels.css" />
  <!-- Blocking on purpose: sets [data-theme] before first paint. -->
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Pi Dashboard <span class="muted">admin</span></h1>
      <span id="version" class="badge tnum">v?</span>
      <span class="badge warn-pill" id="lan-pill" tabindex="0"
            title="Admin is open on the LAN with no login — trusted home network only. Do not expose this port beyond your network.">LAN · no login</span>
    </div>
    <div class="actions">
      <!-- js/savebar.js prepends Undo / Redo / edits / Discard / Save here -->
    </div>
  </header>

  <div class="app">
    <nav class="rail" id="rail" aria-label="Sections"></nav>

    <main class="workspace">
      <nav id="page-bar" class="page-bar" aria-label="Pages"></nav>

      <section class="canvas-area">
        <div class="canvas-head">
          <h2>Layout</h2>
          <div class="canvas-head-actions">
            <span class="muted small" id="canvas-hint">Drag to move · drag corner to resize</span>
            <button id="btn-tidy" class="btn small ghost" title="Auto-arrange widgets with no gaps or overlaps">Tidy up</button>
            <button id="btn-preview" class="btn small ghost">Preview</button>
            <button id="btn-add" class="btn primary small">+ Add widget</button>
          </div>
        </div>
        <div class="canvas-scroll">
          <div id="canvas" class="layout-canvas"></div>
          <div id="preview-wrap" class="preview-wrap hidden"><iframe id="preview-frame" title="Live page preview"></iframe></div>
        </div>
      </section>

      <section class="widget-strip">
        <div class="strip-head">
          <h2>Widgets on this page</h2>
          <label class="search strip-search">
            <span class="visually-hidden">Filter widgets</span>
            <input type="search" id="widget-filter" placeholder="Filter…" />
          </label>
        </div>
        <div id="widget-list" class="widget-list"></div>
      </section>
    </main>

    <aside class="inspector" id="inspector" aria-label="Inspector">
      <div class="inspector-head">
        <div class="inspector-title" id="inspector-title">Page</div>
        <span class="badge scope-pill staged" id="inspector-scope">Staged</span>
      </div>
      <div id="editor" class="inspector-body"></div>
    </aside>
  </div>

  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
